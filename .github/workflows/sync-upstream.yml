name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 1 * * *" # every day (UTC，北京时间上午 9 点)
  workflow_dispatch:

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync unstable and tags from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: unstable
          fetch-depth: 0
          # 使用 PAT 检出，让后续步骤的 git push --tags 也携带 PAT 凭据
          token: ${{ secrets.PAT_WORKFLOW }}

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: looplj/axonhub
          upstream_sync_branch: unstable
          target_sync_branch: unstable
          target_repo_token: ${{ secrets.PAT_WORKFLOW }}

          # rebase 保持线性历史：fork 上的自有提交（本 workflow 文件）
          # 始终重放在上游最新提交之上，不会被官方覆盖
          git_config_pull_rebase: true
          # rebase 会改写提交 SHA，必须 force push
          target_branch_push_args: --force
          test_mode: false

      - name: Sync tags from upstream
        if: steps.sync.outcome == 'success'
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/looplj/axonhub.git
          git fetch upstream --tags
          git push origin --tags --force

      - name: Sync failure guidance
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ 上游同步未完成 / Upstream synchronization did not complete"
            echo
            echo "可能原因："
            echo "1. 上游近期修改了 workflow 文件，rebase 产生冲突；"
            echo "2. GitHub 暂停了包含 workflow 变更的自动同步；"
            echo "3. PAT 过期或 Actions 权限变更。"
            echo
            echo "处理建议：在本地执行 \`git fetch upstream && git checkout unstable && git rebase upstream/unstable\`，"
            echo "解决冲突后 \`git push origin unstable --force-with-lease\`，再手动重新运行本工作流。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[Error] 上游同步未能完成，请查看上方指引。"
          exit 1
